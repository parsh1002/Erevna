services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: erevna-postgres

    environment:
      POSTGRES_DB: erevna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10Feb@2004

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
